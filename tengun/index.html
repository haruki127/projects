<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>点群データ危険度マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #header { background: #2c3e50; color: #fff; padding: 10px 20px; }
    #header h1 { margin: 0; font-size: 18px; }
    #controls { padding: 10px 20px; background: #f4f4f4; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    #controls label { font-size: 14px; }
    #controls input[type=file] { font-size: 13px; }
    #analyze-btn { padding: 8px 20px; background: #2980b9; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    #analyze-btn:disabled { background: #aaa; cursor: not-allowed; }
    #status { font-size: 13px; color: #555; }
    #progress-wrap { padding: 4px 20px 8px; background: #f4f4f4; display: none; gap: 6px; flex-direction: column; }
    .prog-row { display: flex; align-items: center; gap: 8px; }
    .prog-title { font-size: 12px; color: #555; width: 80px; flex-shrink: 0; }
    .prog-bg { flex: 1; background: #ddd; border-radius: 4px; height: 8px; overflow: hidden; position: relative; }
    .prog-bar { height: 8px; background: #2980b9; border-radius: 4px; transition: width 0.2s; width: 0%; }
    .prog-bar.indeterminate { width: 30%; position: absolute; animation: slide 1.4s infinite ease-in-out; }
    .prog-bar.done { background: #27ae60; width: 100%; }
    .prog-label { font-size: 12px; color: #555; width: 130px; flex-shrink: 0; text-align: right; }
    @keyframes slide {
      0%   { left: -35%; }
      100% { left: 110%; }
    }
    #detail-log { padding: 4px 20px 6px; background: #f4f4f4; display: none;
                  font-size: 12px; color: #444; font-family: monospace; }
    #map { flex: 1; }
    #legend { position: absolute; bottom: 30px; right: 10px; z-index: 1000; background: rgba(255,255,255,0.9);
              padding: 8px 12px; border-radius: 6px; font-size: 12px; line-height: 1.8; }
  </style>
</head>
<body>
<div id="header"><h1>点群データ 危険度マッピングシステム</h1></div>
<div id="controls">
  <label>災害前 LAS: <input type="file" id="before-file" accept=".las,.laz" multiple></label>
  <label>災害後 LAS: <input type="file" id="after-file" accept=".las,.laz" multiple></label>
  <button id="analyze-btn" onclick="runAnalyze()">解析実行</button>
  <span id="status"></span>
</div>
<div id="progress-wrap" style="display:none; flex-direction:column; padding:4px 20px 8px; background:#f4f4f4; gap:6px;">
  <div class="prog-row">
    <span class="prog-title">アップロード</span>
    <div class="prog-bg"><div id="bar-upload" class="prog-bar"></div></div>
    <span id="label-upload" class="prog-label"></span>
  </div>
  <div class="prog-row">
    <span class="prog-title">解析</span>
    <div class="prog-bg"><div id="bar-analyze" class="prog-bar"></div></div>
    <span id="label-analyze" class="prog-label"></span>
  </div>
</div>
<div id="detail-log"></div>
<div id="map"></div>
<div id="legend">
  <b>危険度</b><br>
  <span style="color:#006400">■</span> 1〜3 低<br>
  <span style="color:#ffa500">■</span> 4〜6 中<br>
  <span style="color:#cc0000">■</span> 7〜10 高
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map("map").setView([35.6, 139.7], 13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap contributors"
}).addTo(map);

let markerLayer = L.layerGroup().addTo(map);
let pollingTimer = null;

function stopPolling() {
  if (pollingTimer) { clearInterval(pollingTimer); pollingTimer = null; }
}

function dangerColor(d) {
  if (d <= 3) return "#006400";
  if (d <= 6) return "#ffa500";
  return "#cc0000";
}

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

function showProgressWrap(visible) {
  document.getElementById("progress-wrap").style.display = visible ? "flex" : "none";
  if (!visible) setDetailLog("");
}

function setUploadProgress(pct, label) {
  const bar = document.getElementById("bar-upload");
  bar.classList.remove("indeterminate", "done");
  bar.style.width = pct + "%";
  document.getElementById("label-upload").textContent = label || `${pct}%`;
}

function setAnalyzeProgress(state, pct) {
  const bar = document.getElementById("bar-analyze");
  const lbl = document.getElementById("label-analyze");
  bar.classList.remove("indeterminate", "done");
  if (state === "waiting") {
    bar.style.width = "0%";
    lbl.textContent = "";
  } else if (state === "running") {
    if (pct > 0) {
      bar.style.width = pct + "%";
      lbl.textContent = pct + "%";
    } else {
      bar.classList.add("indeterminate");
      lbl.textContent = "処理中...";
    }
  } else if (state === "done") {
    bar.style.width = "100%";
    bar.classList.add("done");
    lbl.textContent = "完了";
  }
}

function setDetailLog(text) {
  const el = document.getElementById("detail-log");
  if (text) {
    el.style.display = "block";
    el.textContent = "▶ " + text;
  } else {
    el.style.display = "none";
    el.textContent = "";
  }
}

function uploadOne(sessionId, fileType, file) {
  return new Promise((resolve, reject) => {
    const form = new FormData();
    form.append("session_id", sessionId);
    form.append("type", fileType);
    form.append("file", file);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/upload");
    xhr.onload = () => {
      try {
        const res = JSON.parse(xhr.responseText);
        res.error ? reject(new Error(res.error)) : resolve();
      } catch (e) {
        reject(new Error("レスポンス解析エラー"));
      }
    };
    xhr.onerror = () => reject(new Error("通信エラー"));
    xhr.send(form);
  });
}

async function runAnalyze() {
  const beforeFiles = document.getElementById("before-file").files;
  const afterFiles  = document.getElementById("after-file").files;
  if (!beforeFiles.length || !afterFiles.length) {
    alert("災害前・後の両ファイルを選択してください");
    return;
  }

  stopPolling();
  const btn = document.getElementById("analyze-btn");
  btn.disabled = true;

  const sessionId = crypto.randomUUID();
  const allFiles = [
    ...[...beforeFiles].map(f => ({ type: "before", file: f })),
    ...[...afterFiles].map(f  => ({ type: "after",  file: f })),
  ];
  const total = allFiles.length;

  showProgressWrap(true);
  setUploadProgress(0, `0 / ${total} ファイル`);
  setAnalyzeProgress("waiting");

  try {
    // Step 1: 1ファイルずつアップロード
    for (let i = 0; i < total; i++) {
      const { type, file } = allFiles[i];
      await uploadOne(sessionId, type, file);
      setUploadProgress(Math.round((i + 1) / total * 100), `${i + 1} / ${total} ファイル`);
    }

    // Step 2: 解析開始
    setAnalyzeProgress("running");

    const res = await fetch("/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId })
    }).then(r => r.json());

    if (res.error) throw new Error(res.error);
    const job_id = res.job_id;

    // Step 3: 2秒ごとに完了を確認（ポーリング）
    await new Promise((resolve, reject) => {
      pollingTimer = setInterval(async () => {
        try {
          const job = await fetch(`/status/${job_id}`).then(r => r.json());
          if (job.status === "done") {
            stopPolling();
            setAnalyzeProgress("done");
            setDetailLog("");
            renderResult(job.result);
            resolve();
          } else if (job.status === "error") {
            stopPolling();
            setDetailLog("");
            alert("解析エラー: " + job.error);
            reject();
          } else if (job.status === "processing") {
            setAnalyzeProgress("running", job.pct || 0);
            setDetailLog(job.detail || "");
          }
        } catch (e) {
          stopPolling();
          alert("通信エラー: " + e);
          reject();
        }
      }, 2000);
    });

  } catch (e) {
    if (e.message) alert("エラー: " + e.message);
    showProgressWrap(false);
  } finally {
    btn.disabled = false;
    setStatus("");
  }
}

function renderResult(geojson) {
  markerLayer.clearLayers();
  const bounds = [];
  geojson.features.forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    const d = f.properties.danger;
    L.circleMarker([lat, lon], {
      radius: 6, color: dangerColor(d), fillColor: dangerColor(d),
      fillOpacity: 0.7, weight: 1
    }).bindPopup(`危険度: ${d}<br>ΔZ: ${f.properties.delta_z}m`).addTo(markerLayer);
    bounds.push([lat, lon]);
  });
  if (bounds.length) map.fitBounds(bounds);
  setStatus(`解析完了: ${geojson.features.length} 箇所`);
}
</script>
</body>
</html>
